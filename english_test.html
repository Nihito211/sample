<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語ランダムテスト (25問)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #d35400;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .quiz-item {
            padding: 15px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .quiz-item:last-child {
            border-bottom: none;
        }
        .question {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        .result-comment {
            margin-top: 5px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #d35400;
        }
        #score-display {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            color: #2c3e50;
            display: none;
        }
    </style>
</head>

<div class="container">

    </form>

    <div id="score-display"></div>
</div>

    { jp: "退職する", en: "retire" }, { jp: "〜を説得する", en: "persuade" }, { jp: "〜を決定する", en: "determine" }, { jp: "〜を除外する", en: "omit" }, { jp: "後者の", en: "latter" },
    { jp: "〜を決心する", en: "resolve" }, { jp: "〜を扱う", en: "handle" }, { jp: "正しい", en: "correct" }, { jp: "〜を断言する", en: "assert" }, { jp: "〜を造る", en: "manufacture" },
    { jp: "具体的な", en: "concrete" }, { jp: "かなりの", en: "considerable" }, { jp: "〜に強いる", en: "force" }, { jp: "〜を占める", en: "occupy" }, { jp: "〜に意見を求める", en: "consult" },
    { jp: "政治の", en: "political" }, { jp: "〜をやめる", en: "quit" }, { jp: "実際の", en: "actual" }, { jp: "〜を見落とす", en: "overlook" }, { jp: "〜を放送する", en: "broadcast" }
];

let selectedQuestions = [];

// 25問をランダムに抽出して画面に生成する
function generateQuiz() {
    // データベースをシャッフル
    const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random());
    // 先頭の25問を選択
    selectedQuestions = shuffled.slice(0, 25);

    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    selectedQuestions.forEach((word, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'quiz-item';
        
        itemDiv.innerHTML = `
            <div class="question">${index + 1}. ${word.jp}</div>
            <div class="input-area">
                <input type="text" id="answer-${index}" autocomplete="off" placeholder="英単語を入力">
            </div>
            <div class="result-comment" id="comment-${index}"></div>
        `;
        container.appendChild(itemDiv);
    });
}

// 採点処理
function checkAnswers() {
    let score = 0;

    selectedQuestions.forEach((word, index) => {
        const userInput = document.getElementById(`answer-${index}`).value.trim().toLowerCase();
        const correctAnswer = word.en.toLowerCase();
        const commentDiv = document.getElementById(`comment-${index}`);
        const inputField = document.getElementById(`answer-${index}`);

        inputField.disabled = true; // 入力を固定
        commentDiv.style.display = 'block';

        if (userInput === correctAnswer) {
            score++;
            commentDiv.innerHTML = `〇 正解！`;
            commentDiv.className = 'result-comment correct';
        } else {
            commentDiv.innerHTML = `× 不正解（正解: <strong>${word.en}</strong>）`;
            commentDiv.className = 'result-comment incorrect';
        }
    });

    // スコアの表示
    const scoreDisplay = document.getElementById('score-display');
    scoreDisplay.style.display = 'block';
    scoreDisplay.innerHTML = `結果: 25問中 ${score}問 正解！ (得点率: ${Math.round((score / 25) * 100)}%)`;

    // ボタンの切り替え
    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('retry-btn').style.display = 'inline-block';
}

// ページ読み込み時にクイズを生成
window.onload = generateQuiz;
</script>
